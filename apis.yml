name: Autoservicefinancelimited

description: 'Autoservicefinancelimited, now operating as Bumper International Limited, provides a digital payment platform for car repair financing in the UK. Customers can spread the cost of repairs, parts, and services over interest‑free monthly installments, with no hidden fees. The service is regulated by the Financial Conduct Authority and serves over 5,000 dealers, offering quick credit decisions and a seamless online experience for both drivers and businesses.'

