description: Bumper provides webhook events for the payment lifecycle.
events:
- event: APPLIED
  description: Triggered when a customer submits a PayLater application, indicating a credit check has been attempted.
- event: SIGNED
  description: Sent when the customer has successfully added their card details and been accepted, marking the payment as complete.
- event: SETTLED
  description: Sent once the payment has been processed and Bumper has paid funds into the client’s account.
delivery:
  signature: X-Signature header containing an HMAC‑SHA256 signature of the sorted event body parameters.
